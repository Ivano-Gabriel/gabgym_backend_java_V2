server.port=8081

# Configuração do Banco — lê de variável de ambiente, mas usa o valor local como padrão
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gabgym?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:132322}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
# JWT
jwt.secret=${JWT_SECRET:troque-isso-por-uma-string-bem-grande-e-aleatoria-depois-minimo-32-caracteres}server.port=8081

cors.allowed.origin=${CORS_ORIGIN:http://localhost:3000}