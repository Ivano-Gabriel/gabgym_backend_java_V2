server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.default_schema=gabgym
spring.flyway.enabled=true
spring.flyway.schemas=gabgym
spring.flyway.default-schema=gabgym
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
cors.allowed.origin=${CORS_ORIGIN:http://localhost:3000}

# Seeding handled by DataInitializer; the legacy data.sql is empty.
spring.sql.init.mode=never
