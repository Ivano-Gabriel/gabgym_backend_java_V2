name: GabGym backend security checks
on:
  push:
    branches: ['rescue/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean test
        env:
          DB_URL: jdbc:h2:mem:gabgymtest;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: ''
          DB_DIALECT: org.hibernate.dialect.H2Dialect
          JWT_SECRET: dGhpcy1pcy1hLXRlc3Rpbmctb25seS1zdHJpbmctdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaG1hYw==

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gabgym_ci
          POSTGRES_PASSWORD: gabgym_ci_only_not_production
          POSTGRES_DB: gabgym_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabgym_ci -d gabgym_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pre-provision private application schema (as database admin)
        run: |
          PGPASSWORD=gabgym_ci_only_not_production psql -h localhost -p 5432 -U gabgym_ci -d gabgym_ci -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS gabgym'
      - name: Validate Flyway migration and run HTTP integration tests on PostgreSQL 17
        run: |
          chmod +x ./mvnw
          ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gabgym_ci
          SPRING_DATASOURCE_USERNAME: gabgym_ci
          SPRING_DATASOURCE_PASSWORD: gabgym_ci_only_not_production
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_FLYWAY_ENABLED: 'true'
          TEST_DB_SCHEMA: gabgym
          JWT_SECRET: dGhpcy1pcy1hLXRlc3Rpbmctb25seS1zdHJpbmctdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaG1hYw==
